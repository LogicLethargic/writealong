name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Byte-compile all Python sources
        run: python -m compileall -q .
